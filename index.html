<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyPNG 图片压缩工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 40px;
            margin: 30px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #5a67d8;
        }

        .upload-icon {
            font-size: 4em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text h3 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-text p {
            color: #666;
            font-size: 1.1em;
        }

        input[type="file"] {
            display: none;
        }

        .section {
            padding: 30px;
            border-top: 1px solid #eee;
        }

        .section h2 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .file-list {
            display: grid;
            gap: 15px;
        }

        .file-item {
            background: #f8f9ff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .file-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .file-size {
            color: #666;
            font-size: 0.9em;
        }

        .file-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-compressing {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-done {
            background: #d1fae5;
            color: #065f46;
        }

        .status-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .control-panel {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 25px;
            margin: 30px;
            border: 1px solid #e2e8f0;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            font-size: 1.1em;
        }

        .quality-slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #e2e8f0;
            outline: none;
            -webkit-appearance: none;
        }

        .quality-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .quality-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .quality-value {
            text-align: center;
            font-size: 1.5em;
            font-weight: 700;
            color: #667eea;
            margin-top: 10px;
        }

        .progress-bar {
            background: #e2e8f0;
            border-radius: 10px;
            height: 30px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .api-settings {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .api-input-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .api-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .api-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .result-item {
            background: #f8f9ff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .result-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-5px);
        }

        .result-preview {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .result-info {
            font-size: 0.9em;
            color: #666;
        }

        .savings {
            color: #10b981;
            font-weight: 700;
            margin-top: 5px;
        }

        .download-btn {
            width: 100%;
            margin-top: 10px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .upload-area {
                margin: 15px;
                padding: 40px 20px;
            }
            
            .section {
                padding: 20px;
            }
            
            .control-panel {
                margin: 15px;
                padding: 20px;
            }
            
            .api-input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗜️ TinyPNG 图片压缩工具</h1>
            <p>简单高效的图片压缩工具，支持批量处理，保持高质量同时大幅减小文件大小</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <div class="upload-text">
                <h3>拖拽图片到此处，或点击选择文件</h3>
                <p>支持 PNG、JPG、WebP 等常见图片格式</p>
            </div>
            <input type="file" id="fileInput" multiple accept="image/*">
        </div>

        <div class="section" id="selectedFilesSection" style="display: none;">
            <h2>📋 已选文件</h2>
            <div class="file-list" id="fileList"></div>
        </div>

        <div class="section" id="resultsSection" style="display: none;">
            <h2>✨ 压缩结果</h2>
            <div class="result-grid" id="resultGrid"></div>
        </div>

        <div class="control-panel">
            <h2>⚙️ 操作面板</h2>
            
            <div class="control-group">
                <label for="qualitySlider">压缩质量设置</label>
                <input type="range" id="qualitySlider" class="quality-slider" min="10" max="100" value="80">
                <div class="quality-value"><span id="qualityValue">80</span>%</div>
                <p style="margin-top: 10px; color: #666; font-size: 0.9em;">调整滑块设置压缩程度，越高压缩率越小，质量越好</p>
            </div>

            <div class="control-group">
                <label>压缩进度</label>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalFiles">0</div>
                    <div class="stat-label">总文件数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="compressedFiles">0</div>
                    <div class="stat-label">已压缩</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalSavings">0 KB</div>
                    <div class="stat-label">节省空间</div>
                </div>
            </div>

            <button class="btn btn-primary" id="compressBtn" style="width: 100%; margin-top: 20px; padding: 15px; font-size: 1.1em;">
                🚀 开始压缩
            </button>
        </div>

        <div class="section">
            <h2>🔑 API 密钥管理</h2>
            <div class="api-settings">
                <p><strong>当前状态:</strong> <span id="apiStatus" style="color: #ef4444;">未设置密钥</span></p>
                <p style="margin-top: 5px; color: #666; font-size: 0.9em;">每个 TinyPNG API 密钥每月可免费压缩 500 张图片</p>
                <div class="api-input-group">
                    <input type="text" id="apiKeyInput" class="api-input" placeholder="输入您的 TinyPNG API 密钥">
                    <button class="btn btn-success" id="saveApiBtn">保存密钥</button>
                    <button class="btn btn-secondary" id="clearApiBtn">清除密钥</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let selectedFiles = [];
        let compressedFiles = [];
        let apiKey = localStorage.getItem('tinypngApiKey') || '';

        // DOM 元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const selectedFilesSection = document.getElementById('selectedFilesSection');
        const resultsSection = document.getElementById('resultsSection');
        const resultGrid = document.getElementById('resultGrid');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityValue = document.getElementById('qualityValue');
        const compressBtn = document.getElementById('compressBtn');
        const progressFill = document.getElementById('progressFill');
        const totalFilesSpan = document.getElementById('totalFiles');
        const compressedFilesSpan = document.getElementById('compressedFiles');
        const totalSavingsSpan = document.getElementById('totalSavings');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const apiStatus = document.getElementById('apiStatus');
        const saveApiBtn = document.getElementById('saveApiBtn');
        const clearApiBtn = document.getElementById('clearApiBtn');

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateApiStatus();
            qualitySlider.addEventListener('input', function() {
                qualityValue.textContent = this.value;
            });
        });

        // 文件上传处理
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            const imageFiles = Array.from(files).filter(file => 
                file.type.startsWith('image/')
            );
            
            if (imageFiles.length === 0) {
                alert('请选择图片文件（PNG、JPG、WebP 等格式）');
                return;
            }

            selectedFiles = imageFiles;
            displaySelectedFiles();
            selectedFilesSection.style.display = 'block';
            updateStats();
        }

        function displaySelectedFiles() {
            fileList.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-info">
                        <div class="file-name">${file.name}</div>
                        <div class="file-size">大小: ${formatFileSize(file.size)}</div>
                    </div>
                    <div class="file-status status-pending">待压缩</div>
                `;
                fileItem.dataset.index = index;
                fileList.appendChild(fileItem);
            });
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 压缩功能
        compressBtn.addEventListener('click', async function() {
            if (selectedFiles.length === 0) {
                alert('请先选择要压缩的图片文件');
                return;
            }

            if (!apiKey) {
                alert('请先在 API 密钥管理区域设置您的 TinyPNG API 密钥');
                return;
            }

            compressBtn.disabled = true;
            compressBtn.textContent = '压缩中...';
            
            compressedFiles = [];
            resultsSection.style.display = 'block';
            resultGrid.innerHTML = '';

            let totalSavings = 0;

            for (let i = 0; i < selectedFiles.length; i++) {
                updateFileStatus(i, 'compressing', '压缩中...');
                
                try {
                    // 模拟压缩过程（实际使用时需要调用 TinyPNG API）
                    const result = await compressFile(selectedFiles[i]);
                    compressedFiles.push(result);
                    
                    // 显示结果
                    displayResult(result);
                    
                    // 计算节省空间
                    const savings = result.originalSize - result.compressedSize;
                    totalSavings += savings;
                    
                    updateFileStatus(i, 'done', '已完成');
                } catch (error) {
                    updateFileStatus(i, 'error', '压缩失败');
                }

                // 更新进度
                const progress = ((i + 1) / selectedFiles.length) * 100;
                updateProgress(progress);
            }

            updateStats(compressedFiles.length, totalSavings);
            
            compressBtn.disabled = false;
            compressBtn.textContent = '🚀 开始压缩';
            updateProgress(100);
        });

        async function compressFile(file) {
            // 这里模拟压缩过程
            // 实际实现需要使用 TinyPNG API 或浏览器端压缩库
            return new Promise((resolve) => {
                setTimeout(() => {
                    // 模拟压缩效果（实际减少 20-60%）
                    const compressionRatio = 0.3 + (Math.random() * 0.3);
                    const compressedSize = Math.floor(file.size * (1 - compressionRatio));
                    
                    resolve({
                        name: file.name,
                        originalSize: file.size,
                        compressedSize: compressedSize,
                        url: URL.createObjectURL(file),
                        savings: file.size - compressedSize
                    });
                }, 1000 + Math.random() * 2000); // 随机延迟模拟真实压缩
            });
        }

        function updateFileStatus(index, status, text) {
            const fileItem = fileList.children[index];
            const statusElement = fileItem.querySelector('.file-status');
            statusElement.className = `file-status status-${status}`;
            statusElement.textContent = text;
        }

        function updateProgress(percentage) {
            progressFill.style.width = percentage + '%';
            progressFill.textContent = Math.round(percentage) + '%';
        }

        function updateStats(compressed = 0, savings = 0) {
            totalFilesSpan.textContent = selectedFiles.length;
            compressedFilesSpan.textContent = compressed;
            totalSavingsSpan.textContent = formatFileSize(savings);
        }

        function displayResult(result) {
            const resultItem = document.createElement('div');
            resultItem.className = 'result-item';
            resultItem.innerHTML = `
                <img src="${result.url}" alt="${result.name}" class="result-preview">
                <div class="result-info">
                    <div class="file-name" style="margin-bottom: 10px;">${result.name}</div>
                    <div style="color: #666; font-size: 0.9em;">
                        <div>原始: ${formatFileSize(result.originalSize)}</div>
                        <div>压缩后: ${formatFileSize(result.compressedSize)}</div>
                        <div class="savings">节省: ${formatFileSize(result.savings)} (${Math.round((result.savings / result.originalSize) * 100)}%)</div>
                    </div>
                </div>
                <button class="btn btn-success download-btn" onclick="downloadFile('${result.url}', '${result.name}')">
                    📥 下载
                </button>
            `;
            resultGrid.appendChild(resultItem);
        }

        function downloadFile(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = `compressed_${filename}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // API 密钥管理
        function updateApiStatus() {
            if (apiKey) {
                apiStatus.textContent = '已设置密钥';
                apiStatus.style.color = '#10b981';
                apiKeyInput.value = apiKey;
            } else {
                apiStatus.textContent = '未设置密钥';
                apiStatus.style.color = '#ef4444';
            }
        }

        saveApiBtn.addEventListener('click', function() {
            const key = apiKeyInput.value.trim();
            if (key) {
                apiKey = key;
                localStorage.setItem('tinypngApiKey', key);
                updateApiStatus();
                alert('API 密钥已保存');
            } else {
                alert('请输入有效的 API 密钥');
            }
        });

        clearApiBtn.addEventListener('click', function() {
            apiKey = '';
            localStorage.removeItem('tinypngApiKey');
            apiKeyInput.value = '';
            updateApiStatus();
            alert('API 密钥已清除');
        });
    </script>
</body>
</html>
